name: Apply robust 1.16.3 autonomy integration

on:
  push:
    branches:
      - release/1.16.3-autonomous-learning
    paths:
      - .github/workflows/patch-1163-autonomy-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.16.3-autonomous-learning
          fetch-depth: 0
      - name: Patch integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ai_recovery: learned strategy selection.
          p = Path('app/ai_recovery.py')
          text = p.read_text(encoding='utf-8')
          if 'from .ai_learning import choose_action\n' not in text:
              text = text.replace('from .config import DATA_DIR\n', 'from .ai_learning import choose_action\nfrom .config import DATA_DIR\n', 1)
          old = '''    if category in SEARCH_FAILURES:\n        phase = recovery_count % 4\n        if phase == 0:\n            return "canonical_search", None\n        if phase == 1:\n            return "simplified_artist", f"{primary_artist} - {plain_title}".strip(" -")\n        if phase == 2:\n            return "title_first", f"{plain_title} {primary_artist}".strip()\n        return "audio_fallback", f"{primary_artist} {plain_title} audio".strip()\n'''
          new = '''    if category in SEARCH_FAILURES:\n        strategy = choose_action(\n            f"download:{category}",\n            ["canonical_search", "simplified_artist", "title_first", "audio_fallback"],\n            exploration_index=recovery_count,\n        )\n        if strategy == "canonical_search":\n            return strategy, None\n        if strategy == "simplified_artist":\n            return strategy, f"{primary_artist} - {plain_title}".strip(" -")\n        if strategy == "title_first":\n            return strategy, f"{plain_title} {primary_artist}".strip()\n        return strategy, f"{primary_artist} {plain_title} audio".strip()\n'''
          if old not in text:
              raise SystemExit('ai_recovery strategy block missing')
          text = text.replace(old, new, 1)
          text = text.replace('"mode": "adaptive-bounded-autorecovery"', '"mode": "learned-adaptive-bounded-autorecovery"', 1)
          p.write_text(text, encoding='utf-8')

          # service_recovery: include learned evidence in model context.
          p = Path('app/service_recovery.py')
          text = p.read_text(encoding='utf-8')
          if 'from .ai_learning import learning_context\n' not in text:
              text = text.replace('from .config import DATA_DIR\n', 'from .ai_learning import learning_context\nfrom .config import DATA_DIR\n', 1)
          if 'compact_learning = learning_context(10)' not in text:
              text = text.replace(
                  '    prompt = (\n        "Je bent de lokale Top40Archiver operations-assistent. Analyseer uitsluitend deze "\n',
                  '    compact_learning = learning_context(10)\n    prompt = (\n        "Je bent de lokale Top40Archiver operations-assistent. Gebruik eerdere geverifieerde "\n        "actie-uitkomsten als ervaring. Analyseer uitsluitend deze "\n',
                  1,
              )
              text = text.replace(
                  '        + json.dumps(compact, ensure_ascii=False)\n    )\n',
                  '        + json.dumps({"afwijkingen": compact, "geleerde_acties": compact_learning}, ensure_ascii=False)\n    )\n',
                  1,
              )
          p.write_text(text, encoding='utf-8')

          # Safe action: hard destructive executable guard.
          p = Path('scripts/top40-safe-action')
          text = p.read_text(encoding='utf-8')
          if 'FORBIDDEN_EXECUTABLES' not in text:
              marker = '}\n\n\ndef main() -> int:\n'
              guard = '''}\n\nFORBIDDEN_EXECUTABLES = {"rm", "unlink", "shred"}\n\n\ndef _validate_action_policy() -> None:\n    for name, command in ACTIONS.items():\n        executable = str(command[0]).rsplit("/", 1)[-1] if command else ""\n        if executable in FORBIDDEN_EXECUTABLES:\n            raise RuntimeError(f"verboden destructieve AI-actie: {name}")\n\n\ndef main() -> int:\n    _validate_action_policy()\n'''
              if marker not in text:
                  raise SystemExit('safe action marker missing')
              text = text.replace(marker, guard, 1)
          if '"audio_delete_allowed": False' not in text:
              text = text.replace(
                  '        "stderr": completed.stderr[-2000:],\n    }))\n',
                  '        "stderr": completed.stderr[-2000:],\n        "policy": {"audio_delete_allowed": False, "free_shell": False},\n    }))\n',
                  1,
              )
          p.write_text(text, encoding='utf-8')

          # update-existing wrapper: verified rollback before any mutation.
          p = Path('update-existing.sh')
          text = p.read_text(encoding='utf-8')
          if 'Verifieerbare versie-rollbackbackup' not in text:
              marker = 'trap cleanup EXIT\n\ncp "$BASE" "$GENERATED"\n'
              replacement = '''trap cleanup EXIT\n\necho "=== Verifieerbare versie-rollbackbackup ==="\nROLLBACK_BACKUP=$(bash "$SRC/scripts/create-version-backup.sh")\n[ -n "$ROLLBACK_BACKUP" ] || { echo "FOUT: rollback-backuppad ontbreekt"; exit 1; }\n[ -f "$ROLLBACK_BACKUP/BACKUP_OK" ] || { echo "FOUT: rollback-backup is niet geverifieerd"; exit 1; }\nexport TOP40_VERSION_BACKUP_REF="$ROLLBACK_BACKUP"\necho "Rollback-backup: $ROLLBACK_BACKUP"\n\ncp "$BASE" "$GENERATED"\n'''
              if marker not in text:
                  raise SystemExit('update backup marker missing')
              text = text.replace(marker, replacement, 1)

          lines = text.splitlines(True)
          if not any('tests/test_ai_learning.py' in line for line in lines):
              for i, line in enumerate(lines):
                  if 'tests/test_ai_operations_worker.py' in line:
                      prefix = line.split('tests/', 1)[0]
                      suffix = ' \\\n' if line.rstrip('\n').endswith('\\') else '\n'
                      lines.insert(i + 1, prefix + 'tests/test_ai_learning.py' + suffix)
                      lines.insert(i + 2, prefix + 'tests/test_version_backup_contract.py' + suffix)
                      break
              else:
                  raise SystemExit('updater tests insertion point missing')
          text = ''.join(lines)

          # Inject extra modifications into the generated transaction script.
          if 'Installeer ook de geverifieerde backup/rollbacktools' not in text:
              marker = 'path.write_text(text, encoding="utf-8")\nPY\n'
              patch = '''\n# Installeer ook de geverifieerde backup/rollbacktools voor volgende releases.\ninstall_marker = 'install -m 0755 "$SRC/scripts/safe-update.sh" "$SAFE_UPDATER"\\n'\ninstall_extra = install_marker + 'install -m 0755 "$SRC/scripts/create-version-backup.sh" /usr/local/sbin/top40-version-backup\\ninstall -m 0755 "$SRC/scripts/restore-version-backup.sh" /usr/local/sbin/top40-version-rollback\\n'\nif install_marker not in text:\n    raise SystemExit("FOUT: safe updater installatiemarkering ontbreekt")\ntext = text.replace(install_marker, install_extra, 1)\n\nhealth_marker = 'assert x.get("production_write") is False\\n'\nhealth_extra = health_marker + 'assert x.get("closed_loop_learning") is True\\nassert x.get("audio_delete_allowed") is False\\nassert x.get("verified_version_backups") is True\\n'\nif health_marker not in text:\n    raise SystemExit("FOUT: AI health policy marker ontbreekt")\ntext = text.replace(health_marker, health_extra, 1)\n\nroute_marker = 'curl -fsS http://127.0.0.1:8041/api/ai/recovery >/dev/null\\n'\nroute_extra = route_marker + 'curl -fsS http://127.0.0.1:8041/api/ai/learning >/dev/null\\n'\nif route_marker not in text:\n    raise SystemExit("FOUT: AI learning route marker ontbreekt")\ntext = text.replace(route_marker, route_extra, 1)\n\n'''
              if marker not in text:
                  raise SystemExit('generated updater patch marker missing')
              text = text.replace(marker, patch + marker, 1)
          p.write_text(text, encoding='utf-8')

          # Future safe updater requires and deploys the backup utilities.
          p = Path('scripts/safe-update.sh')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines(True)
          if not any('scripts/create-version-backup.sh' in line for line in lines):
              for i, line in enumerate(lines):
                  if line.strip() == 'scripts/safe-update.sh':
                      indent = line[:len(line)-len(line.lstrip())]
                      lines.insert(i + 1, indent + 'scripts/create-version-backup.sh\n')
                      lines.insert(i + 2, indent + 'scripts/restore-version-backup.sh\n')
                      break
              else:
                  raise SystemExit('safe updater required list insertion point missing')
          text = ''.join(lines)
          install_marker = 'install -m 0755 "$WORKTREE/scripts/safe-update.sh" /usr/local/sbin/top40-archiver-safe-update\n'
          if '/usr/local/sbin/top40-version-backup' not in text:
              if install_marker not in text:
                  raise SystemExit('safe updater install marker missing')
              text = text.replace(
                  install_marker,
                  install_marker
                  + 'install -m 0755 "$WORKTREE/scripts/create-version-backup.sh" /usr/local/sbin/top40-version-backup\n'
                  + 'install -m 0755 "$WORKTREE/scripts/restore-version-backup.sh" /usr/local/sbin/top40-version-rollback\n',
                  1,
              )
          p.write_text(text, encoding='utf-8')

          p = Path('app/ai_operations_app.py')
          p.write_text(p.read_text(encoding='utf-8').replace('Top40Archiver 1.16.0', 'Top40Archiver 1.16.3'), encoding='utf-8')
          PY

          git rm .github/workflows/patch-1163-autonomy-v2.yml
          git config user.name 'Techraym release automation'
          git config user.email '104164197+Techraym@users.noreply.github.com'
          git add app/ai_recovery.py app/service_recovery.py scripts/top40-safe-action update-existing.sh scripts/safe-update.sh app/ai_operations_app.py
          git commit -m 'Integrate learned recovery and verified rollback policy'
          git push origin HEAD:release/1.16.3-autonomous-learning
