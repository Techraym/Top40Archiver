name: Apply 1.16.4 continuous learning policy

on:
  push:
    branches:
      - release/1.16.4-continuous-autonomy-chart-freshness
    paths:
      - .github/workflows/patch-1164-learning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.16.4-continuous-autonomy-chart-freshness
          fetch-depth: 0
      - name: Patch learning engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/ai_learning.py')
          text=p.read_text(encoding='utf-8')
          text=text.replace('TARGET_DAYS = 7\n', 'TARGET_DAYS = 7  # alleen trendvenster; geen wachtdrempel\nMIN_AUTONOMY_ACTIONS = 25\nMIN_LEARNED_PATTERNS = 3\n', 1)

          old='''def choose_action(problem_key: str, candidates: list[str], exploration_index: int = 0) -> str:\n    """Exploreer onbekende strategieën eerst; gebruik daarna de bewezen beste oplossing."""\n    if not candidates:\n        raise ValueError("candidates mag niet leeg zijn")\n    stats = {str(x["action"]): x for x in learned_actions(problem_key, candidates)}\n    untried = [name for name in candidates if int(stats.get(name, {}).get("evidence_count", 0)) < 2]\n    if untried:\n        return untried[int(exploration_index) % len(untried)]\n\n    def score(name: str) -> tuple[float, int]:\n        item = stats.get(name, {})\n        confidence = float(item.get("confidence", 0.5))\n        effect = float(item.get("average_effect", 0.0))\n        success_rate = float(item.get("success_rate", 0.0))\n        evidence = int(item.get("evidence_count", 0))\n        return (success_rate * 0.55 + confidence * 0.25 + max(0.0, effect) * 0.20, evidence)\n\n    return max(candidates, key=score)\n'''
          new='''def choose_action(problem_key: str, candidates: list[str], exploration_index: int = 0) -> str:\n    """Online learning: ieder resultaat beïnvloedt de eerstvolgende keuze."""\n    if not candidates:\n        raise ValueError("candidates mag niet leeg zijn")\n    stats = {str(x["action"]): x for x in learned_actions(problem_key, candidates)}\n\n    # Nog nooit gebruikte opties krijgen een beperkte exploratiebonus. Vanaf het\n    # eerste resultaat telt de gemeten effectiviteit meteen mee; er is geen fase\n    # waarin eerst dagen of een vast aantal acties afgewacht wordt.\n    def score(name: str) -> tuple[float, float, int]:\n        item = stats.get(name, {})\n        evidence = int(item.get("evidence_count", 0))\n        successes = int(item.get("successes", 0))\n        failures = int(item.get("failures", 0))\n        posterior = (successes + 1.0) / (successes + failures + 2.0)\n        effect = max(-1.0, min(1.0, float(item.get("average_effect", 0.0))))\n        recency_confidence = float(item.get("confidence", 0.5))\n        exploration = 0.22 / math.sqrt(evidence + 1.0)\n        jitter = (((exploration_index + candidates.index(name)) % max(1, len(candidates))) / max(1, len(candidates))) * 0.001\n        value = posterior * 0.58 + ((effect + 1.0) / 2.0) * 0.24 + recency_confidence * 0.18 + exploration + jitter\n        return (value, posterior, evidence)\n\n    return max(candidates, key=score)\n'''
          if old not in text:
              raise SystemExit('choose_action block not found')
          text=text.replace(old,new,1)

          old_ready='''    ready = (\n        days_observed >= TARGET_DAYS\n        and readiness >= 95.0\n        and action_operator == 0\n        and cycle_operator == 0\n        and unresolved == 0\n    )\n'''
          new_ready='''    # Readiness is evidence-driven, not calendar-driven. De worker leert vanaf\n    # actie 1; bij duizenden acties per dag kan de score dus binnen uren rijpen.\n    ready = (\n        total >= MIN_AUTONOMY_ACTIONS\n        and int(patterns or 0) >= MIN_LEARNED_PATTERNS\n        and readiness >= 95.0\n        and action_operator == 0\n        and cycle_operator == 0\n        and unresolved == 0\n    )\n'''
          if old_ready not in text:
              raise SystemExit('ready block not found')
          text=text.replace(old_ready,new_ready,1)
          text=text.replace('"target_days": TARGET_DAYS,', '"trend_window_days": TARGET_DAYS,\n        "minimum_autonomy_actions": MIN_AUTONOMY_ACTIONS,', 1)
          text=text.replace('"goal": "Binnen 7 dagen aantoonbaar het normale Top40Archiver-beheer zelfstandig afhandelen.",', '"goal": "Vanaf de eerste actie online leren en menselijke beheerinteractie zo snel mogelijk overbodig maken.",\n        "learning_mode": "continuous-online-from-action-1",', 1)
          p.write_text(text,encoding='utf-8')
          PY

          git rm .github/workflows/patch-1164-learning.yml
          git config user.name 'Techraym release automation'
          git config user.email '104164197+Techraym@users.noreply.github.com'
          git add app/ai_learning.py
          git commit -m 'Learn continuously from every AI action'
          git push origin HEAD:release/1.16.4-continuous-autonomy-chart-freshness
