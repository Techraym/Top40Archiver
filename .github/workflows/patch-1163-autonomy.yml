name: Apply 1.16.3 autonomy integration

on:
  push:
    branches:
      - release/1.16.3-autonomous-learning
    paths:
      - .github/workflows/patch-1163-autonomy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.16.3-autonomous-learning
          fetch-depth: 0
      - name: Patch autonomous learning integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Download recovery: let verified historical outcomes influence strategy choice.
          p = Path('app/ai_recovery.py')
          text = p.read_text(encoding='utf-8')
          marker = 'from .config import DATA_DIR\n'
          if 'from .ai_learning import choose_action\n' not in text:
              if marker not in text:
                  raise SystemExit('ai_recovery import marker missing')
              text = text.replace(marker, 'from .ai_learning import choose_action\n' + marker, 1)
          old = '''    if category in SEARCH_FAILURES:\n        phase = recovery_count % 4\n        if phase == 0:\n            return "canonical_search", None\n        if phase == 1:\n            return "simplified_artist", f"{primary_artist} - {plain_title}".strip(" -")\n        if phase == 2:\n            return "title_first", f"{plain_title} {primary_artist}".strip()\n        return "audio_fallback", f"{primary_artist} {plain_title} audio".strip()\n'''
          new = '''    if category in SEARCH_FAILURES:\n        strategy = choose_action(\n            f"download:{category}",\n            ["canonical_search", "simplified_artist", "title_first", "audio_fallback"],\n            exploration_index=recovery_count,\n        )\n        if strategy == "canonical_search":\n            return strategy, None\n        if strategy == "simplified_artist":\n            return strategy, f"{primary_artist} - {plain_title}".strip(" -")\n        if strategy == "title_first":\n            return strategy, f"{plain_title} {primary_artist}".strip()\n        return strategy, f"{primary_artist} {plain_title} audio".strip()\n'''
          if old not in text:
              raise SystemExit('ai_recovery strategy block missing')
          text = text.replace(old, new, 1)
          text = text.replace('"mode": "adaptive-bounded-autorecovery"', '"mode": "learned-adaptive-bounded-autorecovery"', 1)
          p.write_text(text, encoding='utf-8')

          # Service model also receives verified experience, but can still never execute free-form commands.
          p = Path('app/service_recovery.py')
          text = p.read_text(encoding='utf-8')
          marker = 'from .config import DATA_DIR\n'
          if 'from .ai_learning import learning_context\n' not in text:
              text = text.replace(marker, 'from .ai_learning import learning_context\n' + marker, 1)
          old = '''    prompt = (\n        "Je bent de lokale Top40Archiver operations-assistent. Analyseer uitsluitend deze "\n'''
          new = '''    compact_learning = learning_context(10)\n    prompt = (\n        "Je bent de lokale Top40Archiver operations-assistent. Gebruik eerdere geverifieerde "\n        "actie-uitkomsten als ervaring. Analyseer uitsluitend deze "\n'''
          if old in text:
              text = text.replace(old, new, 1)
          old_tail = '''        + json.dumps(compact, ensure_ascii=False)\n    )\n'''
          new_tail = '''        + json.dumps({"afwijkingen": compact, "geleerde_acties": compact_learning}, ensure_ascii=False)\n    )\n'''
          if old_tail in text:
              text = text.replace(old_tail, new_tail, 1)
          p.write_text(text, encoding='utf-8')

          # Safe action wrapper has an executable-level destructive guard in addition to the fixed whitelist.
          p = Path('scripts/top40-safe-action')
          text = p.read_text(encoding='utf-8')
          marker = '}\n\n\ndef main() -> int:\n'
          guard = '''}\n\nFORBIDDEN_EXECUTABLES = {"rm", "unlink", "shred"}\n\n\ndef _validate_action_policy() -> None:\n    for name, command in ACTIONS.items():\n        executable = str(command[0]).rsplit("/", 1)[-1] if command else ""\n        if executable in FORBIDDEN_EXECUTABLES:\n            raise RuntimeError(f"verboden destructieve AI-actie: {name}")\n        joined = " ".join(str(x).casefold() for x in command)\n        if "downloaded" in joined and any(token in joined for token in (" rm ", " unlink ", " shred ")):\n            raise RuntimeError(f"AI mag gedownloade audio nooit verwijderen: {name}")\n\n\ndef main() -> int:\n    _validate_action_policy()\n'''
          if 'FORBIDDEN_EXECUTABLES' not in text:
              if marker not in text:
                  raise SystemExit('safe action insertion marker missing')
              text = text.replace(marker, guard, 1)
          old_print = '''        "stderr": completed.stderr[-2000:],\n    }))\n'''
          new_print = '''        "stderr": completed.stderr[-2000:],\n        "policy": {"audio_delete_allowed": False, "free_shell": False},\n    }))\n'''
          if old_print in text:
              text = text.replace(old_print, new_print, 1)
          p.write_text(text, encoding='utf-8')

          # Strong rollback backup must succeed before any target update starts.
          p = Path('update-existing.sh')
          text = p.read_text(encoding='utf-8')
          pre = '''cleanup() {\n  rm -f "$GENERATED"\n}\ntrap cleanup EXIT\n\ncp "$BASE" "$GENERATED"\n'''
          repl = '''cleanup() {\n  rm -f "$GENERATED"\n}\ntrap cleanup EXIT\n\necho "=== Verifieerbare versie-rollbackbackup ==="\nROLLBACK_BACKUP=$(bash "$SRC/scripts/create-version-backup.sh")\n[ -n "$ROLLBACK_BACKUP" ] || { echo "FOUT: rollback-backuppad ontbreekt"; exit 1; }\n[ -f "$ROLLBACK_BACKUP/BACKUP_OK" ] || { echo "FOUT: rollback-backup is niet geverifieerd"; exit 1; }\nexport TOP40_VERSION_BACKUP_REF="$ROLLBACK_BACKUP"\necho "Rollback-backup: $ROLLBACK_BACKUP"\n\ncp "$BASE" "$GENERATED"\n'''
          if 'Verifieerbare versie-rollbackbackup' not in text:
              if pre not in text:
                  raise SystemExit('update wrapper backup insertion marker missing')
              text = text.replace(pre, repl, 1)

          old_tests = '''      tests/test_ai_recovery_strategies.py \\\n      tests/test_cover_drain_worker.py \\\n      tests/test_ai_operations_worker.py \\\n      tests/test_auto_update_contract.py'''
          new_tests = '''      tests/test_ai_recovery_strategies.py \\\n      tests/test_cover_drain_worker.py \\\n      tests/test_ai_operations_worker.py \\\n      tests/test_ai_learning.py \\\n      tests/test_version_backup_contract.py \\\n      tests/test_auto_update_contract.py'''
          if old_tests not in text:
              raise SystemExit('1.16.3 updater test list marker missing')
          text = text.replace(old_tests, new_tests, 1)

          marker = '''path.write_text(text, encoding="utf-8")\nPY\n'''
          generated_patch = '''\n# Installeer ook de geverifieerde backup/rollbacktools voor volgende releases.\ninstall_marker = 'install -m 0755 "$SRC/scripts/safe-update.sh" "$SAFE_UPDATER"\\n'\ninstall_extra = install_marker + 'install -m 0755 "$SRC/scripts/create-version-backup.sh" /usr/local/sbin/top40-version-backup\\ninstall -m 0755 "$SRC/scripts/restore-version-backup.sh" /usr/local/sbin/top40-version-rollback\\n'\nif install_marker not in text:\n    raise SystemExit("FOUT: safe updater installatiemarkering ontbreekt")\ntext = text.replace(install_marker, install_extra, 1)\n\n# Healthcheck controleert dat de nieuwe leerlaag werkelijk door 8041 geladen is.\nhealth_marker = 'assert x.get("production_write") is False\\n'\nhealth_extra = health_marker + 'assert x.get("closed_loop_learning") is True\\nassert x.get("audio_delete_allowed") is False\\nassert x.get("verified_version_backups") is True\\n'\nif health_marker not in text:\n    raise SystemExit("FOUT: AI health policy marker ontbreekt")\ntext = text.replace(health_marker, health_extra, 1)\n\nroute_marker = 'curl -fsS http://127.0.0.1:8041/api/ai/recovery >/dev/null\\n'\nroute_extra = route_marker + 'curl -fsS http://127.0.0.1:8041/api/ai/learning >/dev/null\\n'\nif route_marker not in text:\n    raise SystemExit("FOUT: AI route health marker ontbreekt")\ntext = text.replace(route_marker, route_extra, 1)\n\n'''
          if 'Installeer ook de geverifieerde backup/rollbacktools' not in text:
              if marker not in text:
                  raise SystemExit('generated updater patch marker missing')
              text = text.replace(marker, generated_patch + marker, 1)
          p.write_text(text, encoding='utf-8')

          # Future safe updates require and install rollback tooling.
          p = Path('scripts/safe-update.sh')
          text = p.read_text(encoding='utf-8')
          req_marker = '''  scripts/safe-update.sh\n  systemd/top40-archiver-web.service\n'''
          req_extra = '''  scripts/safe-update.sh\n  scripts/create-version-backup.sh\n  scripts/restore-version-backup.sh\n  systemd/top40-archiver-web.service\n'''
          if req_marker not in text:
              raise SystemExit('safe-update required list marker missing')
          text = text.replace(req_marker, req_extra, 1)
          install_marker = '''install -m 0755 "$WORKTREE/scripts/safe-update.sh" /usr/local/sbin/top40-archiver-safe-update\n'''
          install_extra = install_marker + '''install -m 0755 "$WORKTREE/scripts/create-version-backup.sh" /usr/local/sbin/top40-version-backup\ninstall -m 0755 "$WORKTREE/scripts/restore-version-backup.sh" /usr/local/sbin/top40-version-rollback\n'''
          if install_marker not in text:
              raise SystemExit('safe-update install marker missing')
          text = text.replace(install_marker, install_extra, 1)
          p.write_text(text, encoding='utf-8')

          # Cosmetic version label on recovery dashboard.
          p = Path('app/ai_operations_app.py')
          text = p.read_text(encoding='utf-8').replace('Top40Archiver 1.16.0', 'Top40Archiver 1.16.3')
          p.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/patch-1163-autonomy.yml
          git config user.name 'Techraym release automation'
          git config user.email '104164197+Techraym@users.noreply.github.com'
          git add app/ai_recovery.py app/service_recovery.py scripts/top40-safe-action update-existing.sh scripts/safe-update.sh app/ai_operations_app.py
          git commit -m 'Integrate learned recovery decisions and verified rollback backups'
          git push origin HEAD:release/1.16.3-autonomous-learning
