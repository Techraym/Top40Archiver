name: Tests

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell-syntax controleren
        run: |
          bash -n install.sh
          bash -n install-1.16.0.sh
          bash -n update-existing.sh
          bash -n update-from-github.sh
          bash -n auto-update.sh
          bash -n setup-network-share.sh
          bash -n setup-top40-ca-bundle.sh
          bash -n update-timer.sh
          bash -n scripts/safe-update.sh
          bash -n scripts/install-1.16.0.sh

      - name: 1.16 updatecontract controleren
        run: |
          grep -q 'app.ai_platform:app' systemd/top40-archiver-ai.service
          grep -q 'top40-ai-recovery.timer' update-existing.sh
          grep -q '127.0.0.1:8041/healthz' update-existing.sh
          grep -q '127.0.0.1:8042/healthz' update-existing.sh
          grep -q 'top40-archiver-safe-update' scripts/install-1.16.0.sh

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax controleren
        run: python -m compileall -q app

      - name: Tests uitvoeren
        env:
          TOP40_DATA_DIR: ${{ runner.temp }}/top40-test-data
        run: pytest -q
