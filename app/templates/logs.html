<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f2">
  <title>Logs · Top 40 Archiver</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211f1c;background:#f5f2ed}
    *{box-sizing:border-box}body{margin:0}.shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a8177;font-weight:800}.top h1{margin:4px 0 6px;font-size:clamp(28px,4vw,48px)}.top p{margin:0;color:#70675f}.back{display:inline-flex;text-decoration:none;color:#29241f;background:#fff;border:1px solid #ded8d1;border-radius:12px;padding:11px 15px;font-weight:750;box-shadow:0 8px 25px rgba(63,52,41,.06)}
    .toolbar,.stats,.console{background:#fff;border:1px solid #ded8d1;border-radius:18px;box-shadow:0 12px 35px rgba(63,52,41,.06)}.toolbar{display:flex;flex-wrap:wrap;gap:12px;padding:14px;margin-bottom:14px}.toolbar input,.toolbar select,.toolbar button{border:1px solid #d7d0c8;border-radius:10px;background:#faf9f7;padding:10px 12px;font:inherit}.toolbar input{min-width:260px;flex:1}.toolbar button{cursor:pointer;font-weight:750}.toolbar button.primary{background:#211f1c;color:#fff;border-color:#211f1c}.toolbar button.active{background:#e9f6ed;border-color:#aad7b5;color:#17652c}.toolbar label{display:flex;align-items:center;gap:8px;font-size:14px;color:#655d55}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;overflow:hidden;margin-bottom:14px}.stat{padding:16px;background:#fff}.stat span{display:block;color:#80766c;font-size:13px}.stat b{font-size:28px}.stat.error b{color:#b42318}.stat.warning b{color:#a15c00}.stat.info b{color:#175cd3}
    .console{overflow:hidden}.console-head{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid #e5dfd8;color:#6f665e;font-size:13px}.log-list{height:66vh;min-height:430px;overflow:auto;background:#181716;color:#ece7e1;padding:10px 0;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.log-row{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:5px 14px;border-left:3px solid transparent;white-space:pre-wrap;overflow-wrap:anywhere}.log-row:hover{background:#23211f}.log-row.error{border-color:#ff6b61;background:rgba(180,35,24,.08)}.log-row.warning{border-color:#fdb022}.log-row.info{border-color:#53b1fd}.source{color:#a69d94;text-transform:uppercase;font-size:11px;padding-top:2px}.empty{padding:40px;text-align:center;color:#aaa29a}.notice{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:#fff3e0;color:#7a4700;border:1px solid #f1cf98}.notice[hidden]{display:none}
    @media(max-width:800px){.shell{padding:14px}.top{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.toolbar input{min-width:100%}.log-list{height:70vh}.log-row{grid-template-columns:65px 1fr;padding-left:9px}}
  </style>
  <script src="/static/logs.js?v=1" defer></script>
</head>
<body>
<main class="shell">
  <header class="top">
    <div><span class="eyebrow">Diagnosecentrum</span><h1>Live logs</h1><p>Systemd, downloadfouten en applicatiemeldingen op één plek.</p></div>
    <a class="back" href="/">← Terug naar dashboard</a>
  </header>

  <div id="journal-notice" class="notice" hidden></div>

  <section class="toolbar" aria-label="Logfilters">
    <input id="log-search" type="search" placeholder="Zoek op artiest, foutcode, yt-dlp, 429…" autocomplete="off">
    <select id="log-level" aria-label="Niveau"><option value="all">Alle niveaus</option><option value="error">Alleen fouten</option><option value="warning">Waarschuwingen</option><option value="info">Informatie</option></select>
    <select id="log-limit" aria-label="Aantal regels"><option value="150">150 regels</option><option value="300" selected>300 regels</option><option value="600">600 regels</option><option value="1000">1000 regels</option></select>
    <button id="refresh-now" class="primary">Nu verversen</button>
    <button id="pause-live">Live pauzeren</button>
    <label><input id="auto-scroll" type="checkbox" checked> Automatisch naar beneden</label>
  </section>

  <section class="stats">
    <div class="stat"><span>Totaal zichtbaar</span><b id="count-total">0</b></div>
    <div class="stat error"><span>Fouten</span><b id="count-error">0</b></div>
    <div class="stat warning"><span>Waarschuwingen</span><b id="count-warning">0</b></div>
    <div class="stat info"><span>Informatie</span><b id="count-info">0</b></div>
  </section>

  <section class="console">
    <div class="console-head"><span id="live-state">Verbinden…</span><span>Laatste update: <b id="updated-at">{{ generated_at }}</b></span></div>
    <div id="log-list" class="log-list"><div class="empty">Logs worden geladen…</div></div>
  </section>
</main>
</body>
</html>
